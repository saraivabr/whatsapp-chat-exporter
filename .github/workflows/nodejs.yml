name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    # Check if config.js is valid syntax
    - name: Check config syntax
      run: node -c config.js

    # Check if index.js is valid syntax
    - name: Check index syntax
      run: node -c index.js
